<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="cardGrid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="640" height="280" rx="12" fill="url(#cardBg3)"/>
  <rect width="640" height="280" rx="12" fill="url(#cardGrid3)"/>
  <rect x="1" y="1" width="638" height="278" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="640" height="3" rx="1" fill="url(#blueGradient)"/>

  <!-- Left Information Column -->
  <g transform="translate(36, 40)">
    <rect width="168" height="20" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="8" cy="10" r="2.5" fill="#60A5FA"/>
    <text x="16" y="14" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#93C5FD" letter-spacing="1">SYSTEMS &amp; BACKEND</text>

    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">
      Smart Library System
    </text>

    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">
      Multi-Tier Architecture &amp; Role-Based Access Control
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 102)">
      <rect width="90" height="22" rx="4" fill="#1E293B"/>
      <text x="8" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#60A5FA">ROLES: RBAC</text>

      <rect x="98" width="94" height="22" rx="4" fill="#1E293B"/>
      <text x="106" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#10B981">PATTERN: DAO</text>

      <rect x="200" width="85" height="22" rx="4" fill="#1E293B"/>
      <text x="208" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#FBBF24">DB: MYSQL</text>
    </g>

    <!-- Stack Summary -->
    <g transform="translate(0, 185)">
      <text x="0" y="-8" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#64748B">TECHNOLOGIES</text>
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">
        Java • Java Swing • MySQL • JDBC • DAO Pattern • OOP
      </text>
    </g>
  </g>

  <!-- Right Visual: 3-Tier Layered Architecture Diagram -->
  <g transform="translate(375, 48)">
    <rect width="230" height="184" rx="8" fill="#0D1322" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Tier 1: UI / Swing -->
    <g transform="translate(15, 16)">
      <rect width="200" height="36" rx="5" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
      <text x="10" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#60A5FA">TIER 1: PRESENTATION</text>
      <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#94A3B8">Swing UI (Admin, Librarian, Student)</text>
    </g>

    <!-- Conduit arrow -->
    <path d="M 115 54 L 115 68" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2"/>
    <polygon points="115,70 112,65 118,65" fill="#3B82F6"/>

    <!-- Tier 2: DAO Layer -->
    <g transform="translate(15, 74)">
      <rect width="200" height="36" rx="5" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#34D399">TIER 2: DATA ACCESS OBJECT</text>
      <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#94A3B8">BookDAO, UserDAO, FineDAO, LoanDAO</text>
    </g>

    <!-- Conduit arrow -->
    <path d="M 115 112 L 115 126" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2"/>
    <polygon points="115,128 112,123 118,123" fill="#10B981"/>

    <!-- Tier 3: Database / JDBC -->
    <g transform="translate(15, 132)">
      <rect width="200" height="36" rx="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
      <text x="10" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#FBBF24">TIER 3: PERSISTENCE</text>
      <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#94A3B8">MySQL 8.0 via JDBC Connection Pool</text>
    </g>
  </g>
</svg>
