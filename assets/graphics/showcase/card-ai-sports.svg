<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <pattern id="cardGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="640" height="280" rx="12" fill="url(#cardBg1)"/>
  <rect width="640" height="280" rx="12" fill="url(#cardGrid1)"/>
  <rect x="1" y="1" width="638" height="278" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="640" height="3" rx="1" fill="url(#neonCyan)"/>

  <!-- Left Information Column -->
  <g transform="translate(36, 40)">
    <rect width="130" height="20" rx="4" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="8" cy="10" r="2.5" fill="#00F2FE"/>
    <text x="16" y="14" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#38BDF8" letter-spacing="1">COMPUTER VISION</text>

    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">
      AI Sports Analytics &amp; CV
    </text>

    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">
      Real-Time Biomechanical Pose Estimation &amp; Telemetry
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 102)">
      <rect width="90" height="22" rx="4" fill="#1E293B"/>
      <text x="8" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">REPS: 12/12</text>

      <rect x="98" width="92" height="22" rx="4" fill="#1E293B"/>
      <text x="106" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#10B981">FORM: 94.2%</text>

      <rect x="198" width="85" height="22" rx="4" fill="#1E293B"/>
      <text x="206" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#E879F9">FLEX: 87°</text>
    </g>

    <!-- Stack Pills -->
    <g transform="translate(0, 185)">
      <text x="0" y="-8" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#64748B">TECHNOLOGIES</text>
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">
        TypeScript • React 18 • MediaPipe • Python • Flask • MySQL
      </text>
    </g>
  </g>

  <!-- Right Visual: Skeletal Pose & Telemetry Wireframe -->
  <g transform="translate(490, 140)">
    <!-- Radar ring -->
    <circle r="85" fill="#0B1329" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <circle r="55" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Biomechanical Skeleton Wireframe -->
    <!-- Head -->
    <circle cx="0" cy="-60" r="12" fill="#0F172A" stroke="#00F2FE" stroke-width="2"/>
    <circle cx="0" cy="-60" r="3" fill="#00F2FE"/>

    <!-- Spine -->
    <line x1="0" y1="-48" x2="0" y2="0" stroke="#00F2FE" stroke-width="2"/>

    <!-- Shoulders -->
    <line x1="-32" y1="-36" x2="32" y2="-36" stroke="#00F2FE" stroke-width="2"/>
    
    <!-- Arms -->
    <line x1="-32" y1="-36" x2="-45" y2="-10" stroke="#00F2FE" stroke-width="1.8"/>
    <line x1="-45" y1="-10" x2="-48" y2="15" stroke="#00F2FE" stroke-width="1.8"/>
    <line x1="32" y1="-36" x2="48" y2="-12" stroke="#00F2FE" stroke-width="1.8"/>
    <line x1="48" y1="-12" x2="38" y2="15" stroke="#00F2FE" stroke-width="1.8"/>

    <!-- Pelvis -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#00F2FE" stroke-width="2"/>

    <!-- Legs & Angle Arc -->
    <line x1="-22" y1="0" x2="-28" y2="35" stroke="#00F2FE" stroke-width="2"/>
    <line x1="-28" y1="35" x2="-20" y2="70" stroke="#00F2FE" stroke-width="2"/>
    <line x1="22" y1="0" x2="30" y2="35" stroke="#00F2FE" stroke-width="2"/>
    <line x1="30" y1="35" x2="25" y2="70" stroke="#00F2FE" stroke-width="2"/>

    <!-- Joint Tracking Landmarks -->
    <circle cx="-32" cy="-36" r="4" fill="#10B981"/>
    <circle cx="32" cy="-36" r="4" fill="#10B981"/>
    <circle cx="-45" cy="-10" r="3.5" fill="#38BDF8"/>
    <circle cx="48" cy="-12" r="3.5" fill="#38BDF8"/>
    <circle cx="-28" cy="35" r="4" fill="#A855F7"/>
    <circle cx="30" cy="35" r="4" fill="#A855F7"/>
    <circle cx="-20" cy="70" r="3.5" fill="#00F2FE"/>
    <circle cx="25" cy="70" r="3.5" fill="#00F2FE"/>

    <!-- Angle Arc Annotation -->
    <path d="M 24 25 A 14 14 0 0 1 36 38" fill="none" stroke="#E100FF" stroke-width="1.8"/>
    <text x="42" y="38" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#E879F9">87°</text>
  </g>
</svg>
