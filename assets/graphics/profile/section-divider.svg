<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="auto">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#divLine)" stroke-width="1.2"/>
  <polygon points="450,7 455,12 450,17 445,12" fill="#00F2FE" filter="url(#divGlow)"/>
  <circle cx="450" cy="12" r="1.5" fill="#F8FAFC"/>
